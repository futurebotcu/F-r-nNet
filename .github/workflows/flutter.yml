name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # Golden'lar Windows'ta üretilen platform-bağımlı baseline'lar;
      # Linux runner'da piksel eşleşmesi mümkün değil → tag ile hariç.
      # Yerel doğrulama checklist'i golden'ları çalıştırmaya devam eder.
      - name: Test
        run: flutter test --exclude-tags golden

      - name: Build debug APK
        run: flutter build apk --debug
