appId: com.firinnet.firin_defter
name: FirinNet app smoke
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Kayıtsız devam et"
    timeout: 60000
- tapOn: "Kayıtsız devam et"

- extendedWaitUntil:
    visible: "Feed"
    timeout: 15000

- assertVisible: "FırınNet"
- assertVisible: "Feed"
- assertVisible: "Gruplar"
- assertVisible: "Market"
- assertVisible: "İlanlar"
- assertVisible: "Panel"

- tapOn: "Gruplar"
- extendedWaitUntil:
    visible: "Tüm gruplar"
    timeout: 10000

- tapOn: "Market"
- extendedWaitUntil:
    visible: "Fırıncının B2B pazarı"
    timeout: 10000

- tapOn: "İlanlar"
- extendedWaitUntil:
    visible: "Usta Arıyor"
    timeout: 10000

- tapOn: "Panel"
- extendedWaitUntil:
    visible: "Sektör ağı"
    timeout: 10000

- tapOn: "Feed"
- extendedWaitUntil:
    visible: "Bugün ne paylaşmak istersin?"
    timeout: 15000
