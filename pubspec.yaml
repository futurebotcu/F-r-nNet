name: firin_defter
description: "FırınNet - Fırıncılar için local-first defter uygulaması."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.6.2

  # Formatting
  intl: ^0.20.2

  # Sharing (text/PDF)
  share_plus: ^10.1.2

  # PDF — Bayi Yönetimi V1 hesap özeti üretimi.
  # Sadece doc oluşturmak için 'pdf'; preview/print 'printing' eklenmedi —
  # share_plus ile XFile.fromData üzerinden direkt paylaşım yapılıyor.
  pdf: ^3.11.1

  # Supabase Auth + DB — V1 entegrasyon (opsiyonel: dart-define ile etkinleşir,
  # eksikse uygulama local/mock mode'a düşer). Anahtarlar repo'da yok.
  supabase_flutter: ^2.5.6

  # Persistent local flags (V1.3 — guest mode persist, last_seen_app_version vb).
  # Android: SharedPreferences. iOS: NSUserDefaults. `pm clear` ile silinir.
  shared_preferences: ^2.3.2

  # V1.4 — Hakkında ekranında gerçek sürüm ve build numarası göstermek için.
  # Native channel cevap vermezse fallback "—" gösterilir (sahte versiyon basılmaz).
  package_info_plus: ^8.0.2

  # V1 Social S3 — Feed image post.
  # image_picker: galeri/kameradan resim seçimi.
  # cached_network_image: post kartı + full-screen viewer'da lazy/cached image.
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # V2 Social Core Commit 3 — video post desteği.
  # video_player: native Android/iOS video oynatıcı (Flutter resmî).
  # chewie: video_player üstünde Material UI controls (play/pause/seek/full-screen).
  # Donor `lib/feed/post/video/` PostVideoPlayer muadili — Riverpod ile
  # bağlanır, kullanıcının "autoplay zorunlu değil" kararı gereği
  # autoPlay=false default.
  video_player: ^2.9.2
  chewie: ^1.8.5

  # Profile M4 Polish — SocialPostVideo ekran dışı kayınca pause.
  # google.dev/google/flutter packages tarafından bakım; saf Dart, native
  # plugin yok; flutter widget tree'de visibleFraction event'i sağlar.
  visibility_detector: ^0.4.0+2

  # V1 Market V2 Commit M2 — contact panel için tel: / wa.me / https:// açma.
  # Flutter resmî paket.
  url_launcher: ^6.3.1

  # V1 Messaging M1 — Chat UI renderer (donor: flyer.chat).
  # flutter_chat_ui Apache-2.0, flutter_chat_core MIT. Backend YOK; bizim
  # Supabase repository katmanımız bağlanır. Komple vendor kopya yok.
  # flutter_chat_ui 2.11.x flutter_chat_core 2.9.x'e bağımlı (resmi).
  flutter_chat_ui: ^2.11.1
  flutter_chat_core: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  patrol: ^4.6.1

  # Branded launcher icon üretimi (build-time, runtime'a dahil DEĞİL).
  # Kaynak: assets/branding/firinnet_app_icon*.png. Üretmek için:
  #   flutter pub get && dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4

# FırınNet marka launcher icon yapılandırması.
# - image_path: iOS + legacy Android (opak, alpha'sız master).
# - adaptive_icon_foreground: motif safe-zone'a inset edilmiş şeffaf katman
#   (Android 8+ mask'ında alev/buğday motifi kesilmesin diye %80 inset).
# - adaptive_icon_background: FırınNet sarısına uyumlu çok açık sıcak ton
#   (brandLemonPale #FFFCE8); white-first kimliğe yakın.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/firinnet_app_icon.png"
  adaptive_icon_foreground: "assets/branding/firinnet_app_icon_foreground.png"
  adaptive_icon_background: "#FFFCE8"
  min_sdk_android: 24
  remove_alpha_ios: true

patrol:
  app_name: FırınNet
  android:
    package_name: com.firinnet.firin_defter
  ios:
    bundle_id: com.firinnet.firinDefter

flutter:
  uses-material-design: true

  # PDF üretimi için Unicode destekli font (Türkçe + ₺).
  # Roboto Condensed flutter_gallery_assets'tan alındı, bundled.
  assets:
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
    # Marka ikonu — onboarding ilk sayfasında brand hero olarak kullanılır.
    - assets/branding/firinnet_app_icon.png
